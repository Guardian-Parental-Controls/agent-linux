name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  release-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test release packaging helpers
        run: python3 scripts/test_release_helpers.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Guardian-Parental-Controls/agent-common
          ref: v1.0.0
          path: _agent-common
      - name: Use path patch for common
        run: |
          mkdir -p .cargo
          printf '%s\n' \
            '[patch."https://github.com/Guardian-Parental-Controls/agent-common"]' \
            'guardian-agent-common = { path = "_agent-common" }' \
            > .cargo/config.toml
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libdbus-1-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib
