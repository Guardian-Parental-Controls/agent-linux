name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact_id: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            artifact_id: linux-aarch64
    steps:
      - name: Check out agent-linux
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Check out agent-common
        uses: actions/checkout@v5
        with:
          repository: Guardian-Parental-Controls/agent-common
          ref: ${{ env.RELEASE_TAG }}
          path: _agent-common

      - name: Use path patch for common
        run: |
          mkdir -p .cargo
          printf '%s\n' \
            '[patch."https://github.com/Guardian-Parental-Controls/agent-common"]' \
            'guardian-agent-common = { path = "_agent-common" }' \
            > .cargo/config.toml

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libdbus-1-dev libssl-dev \
            gcc-aarch64-linux-gnu

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        env:
          GUARDIAN_AGENT_VERSION: ${{ env.RELEASE_TAG }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Package release archive
        run: |
          chmod +x scripts/package-linux-release.sh
          scripts/package-linux-release.sh "${{ matrix.target }}" dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_id }}
          path: |
            dist/guardian-agent-${{ matrix.target }}.tar.gz
            dist/guardian-agent-${{ matrix.target }}.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: dist/*
          fail_on_unmatched_files: true

      - name: Create versions automation token
        if: secrets.GUARDIAN_VERSIONS_APP_ID != ''
        id: versions-token
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GUARDIAN_VERSIONS_APP_ID }}
          private-key: ${{ secrets.GUARDIAN_VERSIONS_PRIVATE_KEY }}
          owner: Guardian-Parental-Controls
          repositories: versions

      - name: Publish agent-linux version
        if: steps.versions-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.versions-token.outputs.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          base="https://github.com/Guardian-Parental-Controls/agent-linux/releases/download/${RELEASE_TAG}"
          gh api "repos/Guardian-Parental-Controls/versions/dispatches" \
            --method POST \
            --input - <<EOF
          {
            "event_type": "component-release",
            "client_payload": {
              "component": "agent-linux",
              "version": "${version}",
              "repository": "https://github.com/Guardian-Parental-Controls/agent-linux",
              "minimum_supported_version": "1.0.0",
              "min_server": "1.0.0",
              "protocol_version": 1,
              "install_script": "https://raw.githubusercontent.com/Guardian-Parental-Controls/agent-linux/${RELEASE_TAG}/scripts/install-agent.sh",
              "artifacts": [
                {
                  "id": "linux-x86_64",
                  "url": "${base}/guardian-agent-x86_64-unknown-linux-gnu.tar.gz",
                  "checksum_url": "${base}/guardian-agent-x86_64-unknown-linux-gnu.tar.gz.sha256"
                },
                {
                  "id": "linux-aarch64",
                  "url": "${base}/guardian-agent-aarch64-unknown-linux-gnu.tar.gz",
                  "checksum_url": "${base}/guardian-agent-aarch64-unknown-linux-gnu.tar.gz.sha256"
                }
              ]
            }
          }
          EOF
