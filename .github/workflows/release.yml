name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG="${TAG#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_id: linux-x86_64
            target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
          - arch_id: linux-aarch64
            target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libdbus-1-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Build guardian-agent
        run: cargo build --release --bin guardian-agent

      - name: Package release archive
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ARCHIVE="guardian-agent-${TARGET_TRIPLE}.tar.gz"
          mkdir -p dist/stage
          BIN="target/${TARGET_TRIPLE}/release/guardian-agent"
          if [[ ! -f "${BIN}" ]]; then
            BIN="target/release/guardian-agent"
          fi
          install -m 0755 "${BIN}" dist/stage/guardian-agent
          tar -czf "dist/${ARCHIVE}" -C dist/stage guardian-agent
          (
            cd dist
            sha256sum "${ARCHIVE}" | awk '{print $1}' > "${ARCHIVE}.sha256"
          )

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch_id }}
          path: dist/guardian-agent-*.tar.gz*

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Recreate empty immutable release (backfill)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.resolve.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            exit 0
          fi
          ASSETS="$(gh release view "$TAG" --json assets -q '.assets|length')"
          IMMUTABLE="$(gh release view "$TAG" --json isImmutable -q .isImmutable)"
          if [[ "$ASSETS" == "0" && "$IMMUTABLE" == "true" ]]; then
            echo "Removing empty immutable release ${TAG} so binaries can be attached"
            gh release delete "$TAG" --yes
          fi

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: ${{ needs.resolve.outputs.tag }}
          generate_release_notes: true
          files: artifacts/*

      - name: Create automation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GUARDIAN_VERSIONS_APP_ID }}
          private-key: ${{ secrets.GUARDIAN_VERSIONS_PRIVATE_KEY }}
          owner: Guardian-Parental-Controls
          repositories: versions

      - name: Publish versions feed component
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          tag = os.environ["TAG"]
          version = os.environ["VERSION"]
          owner_repo = os.environ["REPO"]
          base = f"https://github.com/{owner_repo}/releases/download/{tag}"

          artifacts = []
          for arch_id, target in (
              ("linux-x86_64", "x86_64-unknown-linux-gnu"),
              ("linux-aarch64", "aarch64-unknown-linux-gnu"),
          ):
              name = f"guardian-agent-{target}.tar.gz"
              artifacts.append(
                  {
                      "id": arch_id,
                      "url": f"{base}/{name}",
                      "checksum_url": f"{base}/{name}.sha256",
                  }
              )

          checkout = subprocess.run(
              [
                  "gh",
                  "api",
                  "repos/Guardian-Parental-Controls/versions/contents/components/agent-linux.json",
                  "--jq",
                  ".content",
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          import base64

          current = json.loads(
              base64.b64decode(checkout.stdout).decode("utf-8")
          )
          payload = {
              **current,
              "component": "agent-linux",
              "version": version,
              "repository": f"https://github.com/{owner_repo}",
              "artifacts": artifacts,
              "install_script": (
                  f"https://raw.githubusercontent.com/{owner_repo}/{tag}/scripts/install-agent.sh"
              ),
          }

          body = {
              "event_type": "component-release",
              "client_payload": payload,
          }
          Path("dispatch.json").write_text(json.dumps(body), encoding="utf-8")
          PY
          gh api --method POST repos/Guardian-Parental-Controls/versions/dispatches --input dispatch.json
